<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alenui Rovis Mbah</title>
    <meta name="theme-color" content="#fafafa" />
    <script>
      (function () {
        var d = document.documentElement, t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        d.classList.toggle('dark', dark);
        d.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0c0b14' : '#fafafa';
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" />

  </body>
